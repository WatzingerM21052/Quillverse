<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Quillverse</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages (github.com/rafgraph/spa-github-pages).
      // GitHub Pages has no server-side rewrite for client-side routes, so a
      // direct link or refresh on e.g. /Quillverse/profile 404s. This encodes
      // the path into a query string and redirects to index.html, which
      // decodes it back before Angular's router takes over (see index.html).
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
